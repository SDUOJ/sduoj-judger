name: Compilation

on:
  pull_request:
    branches: 
      - master
  workflow_dispatch: # add manual trigger button

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew build --scan

      - name: Exercise Linux root worker permission branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -a sduoj-judger-service/build/test-results/test sduoj-judger-service/build/test-results/unprivileged
          sudo id -u > sduoj-judger-service/build/ci-test-worker-uid.txt
          sudo --preserve-env=JAVA_HOME,GITHUB_TOKEN,GITHUB_REPOSITORY env GRADLE_USER_HOME="$RUNNER_TEMP/judger-root-gradle" \
            ./gradlew \
            :sduoj-judger-service:test --rerun-tasks --no-daemon \
            --tests '*HelperCompilationTest.crashLeasesAndOtherPidNamespacesAreNeverReused' \
            --tests '*HelperCompilationTest.freshRuntimeInodesCannotBeChangedThroughAnOldWritableDescriptorOrByNobody' \
            --tests '*HelperCompilationTest.identitiesAreExclusiveAcrossTasksAndOnlyTheirOwnerCanWriteBuilds' \
            --tests '*HelperCompilationTest.anUnreapedProcessQuarantinesTheLeaseUntilAbsenceCanBeProved' \
            --tests '*HelperCompilationTest.skipsAnIdentityWithAnExistingProcessEvenWithoutALease' \
            --tests '*HelperCompilationTest.sealingRejectsLinksSpecialFilesAndOversizedTrees' \
            --tests '*HelperCompilationTest.exitAndExceptionCleanupKillsReparentedChildrenBeforeReleasingIdentity' \
            --tests '*RunWorkspaceTest.linuxWorkerPreservesProtectedFilesWhileProgramCanWriteItsOwnDirectory' \
            --tests '*RunWorkspaceTest.linuxWorkerCompilesNestedJavaSourcesAsNobody'

      - name: To disable the cache of sduoj-server packages
        run: rm -rfv ~/.gradle/caches/modules*/**/com.sduoj*/**

      - name: Summarize actual JUnit results
        if: always()
        shell: python
        run: |
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          reports = []
          for source in sorted(pathlib.Path('sduoj-judger-service/build/test-results/test').glob('TEST-*.xml')):
              suite = ET.parse(source).getroot()
              cases = []
              for case in suite.findall('testcase'):
                  status = next((kind for kind in ('failure', 'error', 'skipped') if case.find(kind) is not None), 'passed')
                  cases.append({'class': case.get('classname'), 'name': case.get('name'), 'status': status})
              reports.append({'path': str(source), 'tests': int(suite.get('tests', 0)), 'failures': int(suite.get('failures', 0)), 'errors': int(suite.get('errors', 0)), 'skipped': int(suite.get('skipped', 0)), 'cases': cases})
          totals = {key: sum(report[key] for report in reports) for key in ('tests', 'failures', 'errors', 'skipped')}
          totals['passed'] = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          result = {'sourceRef': os.environ['GITHUB_SHA'], 'runnerOS': os.environ['RUNNER_OS'], 'totals': totals, 'reports': reports}
          worker_uid = pathlib.Path('sduoj-judger-service/build/ci-test-worker-uid.txt')
          result['workerUid'] = worker_uid.read_text().strip() if worker_uid.exists() else None
          result['expectedLinuxInapplicable'] = ['insecureProviderDoesNotFallBackToPathBasedDeletion: default Linux provider supports SecureDirectoryStream; opposite-provider coverage is recorded separately']
          result['externalRequiredGates'] = [{'case': 'HelperCompilationTest.nestedZipSourcesCompileAndTheSealedProgramRunsAsNobody', 'status': 'required-in-actual-worker-image', 'requirements': ['trusted judge entrypoint', 'delegated SDUOJ_CGROUP_ROOT', '/usr/bin/sandbox', '/opt/gcc/13.2.0/bin/g++']}]
          destination = pathlib.Path('sduoj-judger-service/build/ci-test-summary.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Judger JUnit results\n\n' + json.dumps(totals) + '\n')
          if not reports or totals['tests'] == 0:
              raise SystemExit('No executed Judger JUnit XML reports found')

      - name: Preserve JUnit XML and HTML reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: judger-junit-results
          path: |
            sduoj-judger-service/build/ci-test-summary.json
            sduoj-judger-service/build/ci-test-worker-uid.txt
            sduoj-judger-service/build/test-results/test/
            sduoj-judger-service/build/test-results/unprivileged/
            sduoj-judger-service/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 14
