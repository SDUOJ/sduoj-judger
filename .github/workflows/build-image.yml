name: Build and push Docker images

on:
  push:
    branches:
      - master
  workflow_dispatch: # add manual trigger button

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout the reviewed sandbox source
        uses: actions/checkout@v7
        with:
          repository: SDUOJ/sduoj-sandbox
          ref: 28cc4a19f78263b614ea96c99ec55e9b19ad5a5e
          path: sduoj-sandbox
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew build --scan

      - name: To disable the cache of sduoj-server packages
        run: rm -rfv ~/.gradle/caches/modules*/**/com.sduoj*/**

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            sandbox-src=./sduoj-sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.cn-beijing.aliyuncs.com/pre-sduoj/sduoj-judger:${{ github.sha }}
            registry.cn-beijing.aliyuncs.com/pre-sduoj/sduoj-judger:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runtime-verification:
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the published image registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify the final image on its native architecture
        env:
          IMAGE_REF: registry.cn-beijing.aliyuncs.com/pre-sduoj/sduoj-judger@${{ needs.docker.outputs.image_digest }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          docker run --rm -i --network none --entrypoint /bin/bash "$IMAGE_REF" \
            -s -- "$EXPECTED_ARCH" < test/runtime-smoke.sh
